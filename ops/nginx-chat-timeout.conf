# India Compliance Assistant: long-running RAG and case-search requests.
#
# This file is intended for Ubuntu's default /etc/nginx/conf.d/*.conf include,
# which is inside nginx's `http {}` block.  It only applies a longer upstream
# wait window; it does not expose a new port or change any routing rule.
#
# A case query may serially perform query normalisation, Indian Kanoon lookup,
# legal-answer generation, and a grounded case digest.  The normal 60-second
# proxy default can expire while the application is still safely completing the
# same answer, which makes the first browser request show a 504 and a retry hit
# the now-warm cache.  Five minutes keeps that one request intact.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
send_timeout 300s;
